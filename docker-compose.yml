version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: earthyy
      POSTGRES_PASSWORD: earthyy
      POSTGRES_DB: earthyy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthyy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      EARTHYY_DATABASE_URL: postgresql+psycopg2://earthyy:earthyy@postgres:5432/earthyy
      EARTHYY_REDIS_URL: redis://redis:6379/0
      EARTHYY_SECRET_KEY: ${EARTHYY_SECRET_KEY:-dev-only-secret}
      EARTHYY_CORS_ORIGINS: http://localhost:5173
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      EARTHYY_DATABASE_URL: postgresql+psycopg2://earthyy:earthyy@postgres:5432/earthyy
      EARTHYY_REDIS_URL: redis://redis:6379/0
      EARTHYY_SECRET_KEY: ${EARTHYY_SECRET_KEY:-dev-only-secret}
    command: python -m app.workers.worker
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
